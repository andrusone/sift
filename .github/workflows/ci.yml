# CI. Guardrail file: changes need the product owner.
#
# Design:
#   - The workflow always runs, so the `gate` job always reports. Branch protection requires
#     only `gate`; a docs-only change passes it without running the expensive jobs. (Using
#     `paths-ignore` instead would leave a required check pending forever on docs-only PRs.)
#   - Stale runs on a PR are cancelled; runs on main never are.
#   - sift runs on Linux (a headless VM), so tests run on Linux. Add a Windows job only if the
#     code starts to depend on Windows behaviour.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        name: Did anything other than docs change?
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" "${{ github.sha }}" | grep -qvE '\.md$|^docs/|^assets/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  python:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e . pytest "black>=25.12,<26" "ruff>=0.14.10,<0.15"
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Format check (black)
        run: python -m black --check .
      - name: Tests
        run: python -m pytest -q

  placeholders:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: No unresolved template placeholders
        run: bash tools/check-placeholders.sh

  gate:
    if: always()
    needs: [changes, python, placeholders]
    runs-on: ubuntu-24.04
    steps:
      - name: All required jobs passed or were skipped
        run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ join(needs.*.result, ' ') }}' | grep -Eq 'failure|cancelled'; then
            echo "A required job failed or was cancelled"
            exit 1
          fi
